# D-115: nginx config for portal-web SPA.
# Served by the runtime stage of frontend/apps/portal-web/Dockerfile.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for text-based assets.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback: serve index.html for any route not matching a static file
    # so client-side react-router-dom routes work on hard refresh / deep link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted Vite assets (filename contains a content hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxies for backend traffic are NOT configured here. In production the
    # BFF (bff-java) is reached via the K8s Ingress / api.edu.com, and the SPA
    # uses an absolute base URL (VITE_API_BASE). Dev proxying lives in
    # vite.config.ts only.

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
