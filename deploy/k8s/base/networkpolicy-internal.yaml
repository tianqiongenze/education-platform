---
# 8. frontend-portal (HTTP 80) — nginx-ingress (www.edu.com) + Prometheus.
#    Public static SPA, no inter-service calls.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-portal-ingress
  namespace: education-platform
  labels:
    app.kubernetes.io/part-of: education-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: frontend-portal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 80
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 80
