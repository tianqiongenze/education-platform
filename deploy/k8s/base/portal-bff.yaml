apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-bff
  namespace: education-platform
  labels:
    app.kubernetes.io/name: portal-bff
    app.kubernetes.io/part-of: education-platform
    app.kubernetes.io/component: bff
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900  # D-035 rule 1: rollout timeout >= 900s
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal-bff
        app.kubernetes.io/part-of: education-platform
        app.kubernetes.io/component: bff
        topology.kubernetes.io/region: cn-east-1
        topology.kubernetes.io/zone: hz-a
        ep.io/cell: cell-hz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portal-bff
        - maxSkew: 1
          topologyKey: ep.io/cell
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portal-bff
      containers:
        - name: portal-bff
          image: harbor.edu.internal/education-platform/portal-bff:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: dubbo-config
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:+ZGenerational"
            - name: OTEL_SERVICE_NAME
              value: "portal-bff"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=portal-bff,service.namespace=education-platform,deployment.environment=production"
            # D-117: JWT 密钥路径指向 Secret 挂载点 /etc/jwt/。
            # SealedSecret 见 deploy/gitops/sealed-secrets/jwt-sealedsecret.yaml。
            - name: JWT_PRIVATE_KEY_PATH
              value: "/etc/jwt/private.pem"
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/jwt/public.pem"
          # D-117: 挂载 jwt-keys Secret（由 SealedSecret Controller 解密生成）
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 15"
      # D-117: 引用 jwt-keys Secret（来自 SealedSecret 解密）。
      # volumes 位于 pod spec 层（非 container 层），被上方 volumeMounts 引用。
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            # 私钥仅容器内 root 可读（镜像非 root 时需 0440 + runAsUser）
            defaultMode: 0440
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: portal-bff
  namespace: education-platform
  labels:
    app.kubernetes.io/name: portal-bff
    app.kubernetes.io/part-of: education-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: portal-bff
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: portal-bff
  namespace: education-platform
  labels:
    app.kubernetes.io/name: portal-bff
    app.kubernetes.io/part-of: education-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: portal-bff
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
