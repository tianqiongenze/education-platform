apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portal-bff
  namespace: education-platform
  labels:
    app.kubernetes.io/name: portal-bff
    app.kubernetes.io/part-of: education-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portal-bff
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Min
---
