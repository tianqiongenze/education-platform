apiVersion: apps/v1
kind: Deployment
metadata:
  name: grading-service
  namespace: education-platform
  labels:
    app.kubernetes.io/name: grading-service
    app.kubernetes.io/part-of: education-platform
    app.kubernetes.io/component: itbackend
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900  # D-035 rule 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: grading-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grading-service
        app.kubernetes.io/part-of: education-platform
        app.kubernetes.io/component: itbackend
        topology.kubernetes.io/region: cn-east-1
        topology.kubernetes.io/zone: hz-a
        ep.io/cell: cell-hz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8085"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grading-service
        - maxSkew: 1
          topologyKey: ep.io/cell
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: grading-service
      containers:
        - name: grading-service
          image: harbor.edu.internal/education-platform/grading-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8085
              protocol: TCP
            - name: dubbo
              containerPort: 20885
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
            - configMapRef:
                name: dubbo-config
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx512m -XX:+UseG1GC -XX:+ZGenerational"
            - name: DUBBO_PROTOCOL_PORT
              value: "20885"
            - name: OTEL_SERVICE_NAME
              value: "grading-service"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=grading-service,service.namespace=education-platform,deployment.environment=production"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 15"
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: grading-service
  namespace: education-platform
  labels:
    app.kubernetes.io/name: grading-service
    app.kubernetes.io/part-of: education-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grading-service
  ports:
    - name: http
      port: 8085
      targetPort: http
      protocol: TCP
    - name: dubbo
      port: 20885
      targetPort: dubbo
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grading-service
  namespace: education-platform
  labels:
    app.kubernetes.io/name: grading-service
    app.kubernetes.io/part-of: education-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grading-service
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
