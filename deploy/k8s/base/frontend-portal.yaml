# D-portal: Public-facing portal-web (company homepage + course catalog +
# business-unit navigation + unified login entry).
#
# Served at www.edu.com (see ingress.yaml). Static SPA built by Vite and
# served by nginx on port 80 inside the container. All backend calls are
# proxied to the BFF (portal-bff) via the /api prefix.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-portal
  namespace: education-platform
  labels:
    app.kubernetes.io/name: frontend-portal
    app.kubernetes.io/part-of: education-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend-portal
    spec:
      containers:
        - name: portal
          image: harbor.edu.internal/education-platform/frontend-portal:1.0.0
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-portal
  namespace: education-platform
  labels:
    app.kubernetes.io/name: frontend-portal
    app.kubernetes.io/part-of: education-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
