apiVersion: apps/v1
kind: Deployment
metadata:
  name: ws-gateway
  namespace: education-platform
  labels:
    app.kubernetes.io/name: ws-gateway
    app.kubernetes.io/part-of: education-platform
    app.kubernetes.io/component: gateway
spec:
  replicas: 3
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900  # D-035 rule 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ws-gateway
        app.kubernetes.io/part-of: education-platform
        app.kubernetes.io/component: gateway
        topology.kubernetes.io/region: cn-east-1
        topology.kubernetes.io/zone: hz-a
        ep.io/cell: cell-hz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway # D-241: 2-node cell has no zone labels; hard spread made pods permanently unschedulable
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ws-gateway
        - maxSkew: 1
          topologyKey: ep.io/cell
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ws-gateway
      containers:
        - name: ws-gateway
          image: harbor.edu.internal/education-platform/ws-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: OTEL_SERVICE_NAME
              value: "ws-gateway"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.name=ws-gateway,service.namespace=education-platform,deployment.environment=production"
            # D-118: OTLP gRPC exporter endpoint. EnvFrom already pulls the
            # ConfigMap default; this explicit value wins for clarity.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
            - name: OTEL_TRACES_SAMPLER
              value: "parentbased_traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.1"
            # D-117: JWT 公钥路径指向 Secret 挂载点 /etc/jwt/。
            # SealedSecret 见 deploy/gitops/sealed-secrets/jwt-sealedsecret.yaml。
            - name: JWT_PUBLIC_KEY_PATH
              value: "/etc/jwt/public.pem"
          # D-117: 挂载 jwt-keys Secret（仅 public.pem 被 ws-gateway 使用）
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/jwt
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: 2000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 5"
      # D-117: 引用 jwt-keys Secret（来自 SealedSecret 解密）
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
            defaultMode: 0440
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ws-gateway
  namespace: education-platform
  labels:
    app.kubernetes.io/name: ws-gateway
    app.kubernetes.io/part-of: education-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ws-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ws-gateway
  namespace: education-platform
  labels:
    app.kubernetes.io/name: ws-gateway
    app.kubernetes.io/part-of: education-platform
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ws-gateway
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
