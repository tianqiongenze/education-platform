apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sandboxwarmpools.ide.itbackend
  labels:
    app.kubernetes.io/name: grading-service
    app.kubernetes.io/part-of: education-platform
    education-platform.io/decision: "D-185"
spec:
  group: ide.itbackend
  names:
    kind: SandboxWarmPool
    plural: sandboxwarmpools
    singular: sandboxwarmpool
    shortNames:
      - swp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          description: |
            D-185: declares the desired warm-pool shape for the Firecracker
            sandbox backend. The ProcessBuilder backend (Iron Law 8 Option C,
            used in the offline AOT build) reads the same spec to size its
            per-language semaphore permits.
          properties:
            spec:
              type: object
              properties:
                languages:
                  type: array
                  description: Supported language names (JAVA, PYTHON, GO, CPP).
                  items:
                    type: string
                  default:
                    - JAVA
                    - PYTHON
                    - GO
                    - CPP
                snapshotCount:
                  type: integer
                  description: Number of pre-booted microVM snapshots to keep (Firecracker backend).
                  default: 10
                  minimum: 0
                minReady:
                  type: integer
                  description: Minimum ready slots per language.
                  default: 5
                  minimum: 0
                vCpuLimit:
                  type: integer
                  description: vCPU limit per sandbox.
                  default: 1
                  minimum: 1
                memoryMB:
                  type: integer
                  description: Memory limit in MB per sandbox.
                  default: 512
                  minimum: 128
                netEgressBps:
                  type: integer
                  description: |
                    Network egress bandwidth cap in bits per second.
                    0 disables networking entirely (offline grading).
                  default: 0
                  minimum: 0
                timeoutSec:
                  type: integer
                  description: Default execution timeout in seconds.
                  default: 30
                  minimum: 1
              required:
                - languages
            status:
              type: object
              properties:
                readySlots:
                  type: integer
                  description: Current number of ready slots per language.
                lastReconcileAt:
                  type: string
                  format: date-time
      additionalPrinterColumns:
        - name: Languages
          type: string
          jsonPath: .spec.languages
        - name: MinReady
          type: integer
          jsonPath: .spec.minReady
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
