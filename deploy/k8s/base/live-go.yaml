apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-go
  labels:
    app: live-go
    app.kubernetes.io/name: live-go
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: education-platform
spec:
  replicas: 2
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: live-go
  template:
    metadata:
      labels:
        app: live-go
        app.kubernetes.io/name: live-go
        app.kubernetes.io/component: gateway
        topology.kubernetes.io/region: cn-east-1
        topology.kubernetes.io/zone: hz-a
        ep.io/cell: cell-hz
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
        prometheus.io/path: "/healthz"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: live-go
      containers:
        - name: live-go
          image: harbor.edu.internal/education-platform/live-go:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: common-config
          env:
            - name: LIVE_GO_ADDR
              value: ":8090"
            - name: REDIS_ADDR
              value: "redis-cluster:6379"
            # D-187: comma-separated SRS origin host:port list.
            # When empty, WHIP/WHEP return 503 (broadcast disabled).
            - name: SRS_ORIGINS
              value: "srs-origin-1.srs.svc.cluster.local:1985,srs-origin-2.srs.svc.cluster.local:1985"
            # D-187: LiveKit server URL. When empty, interactive mode returns 503.
            - name: LIVEKIT_URL
              value: "http://livekit.livekit.svc.cluster.local:7880"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-key
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: livekit-secrets
                  key: api-secret
            - name: OTEL_SERVICE_NAME
              value: "live-go"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4317"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "grpc"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - "sleep 5"
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: live-go
  labels:
    app: live-go
    app.kubernetes.io/name: live-go
    app.kubernetes.io/part-of: education-platform
spec:
  type: ClusterIP
  selector:
    app: live-go
  ports:
    - name: http
      port: 8090
      targetPort: http
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: live-go
  labels:
    app: live-go
    app.kubernetes.io/name: live-go
    release: prometheus
spec:
  selector:
    matchLabels:
      app: live-go
  endpoints:
    - port: http
      path: /healthz
      interval: 30s
      scrapeTimeout: 10s
