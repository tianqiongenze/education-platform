apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Inherit from local-verify (which has correct env vars, single-node config, etc.)
# but we'll override images and health probes
resources:
  - ../local-verify

# Patch all deployments to use real images + correct health probes
patches:
  # ===== Java services (actuator health) =====
  - target:
      kind: Deployment
      name: edu-portal-bff
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: esp/edu-portal-bff:1.0.0
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /actuator/health/liveness
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 8090
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /actuator/health/readiness
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 8090

  - target:
      kind: Deployment
      name: edu-data-platform
