# 配置覆盖: 用本地值替换不存在的集群内服务 DNS
configMapGenerator:
  # 合并 base 的 common-config, 覆盖指向不存在服务的字段
  - name: common-config
    namespace: education-platform
    behavior: merge
    literals:
      - NACOS_SERVER_ADDR=127.0.0.1:8848
      - PULSAR_URL=pulsar://127.0.0.1:6650
      - PULSAR_WEB_URL=http://127.0.0.1:8080
      - REDIS_CLUSTER_NODES=127.0.0.1:6379
      - TIDB_JDBC_URL=jdbc:mysql://127.0.0.1:4000/education
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
      - MILVUS_HOST=127.0.0.1
      - MILVUS_PORT=19530
      - JETSTREAM_URL=nats://127.0.0.1:4222
      - CELL_NAME=local
      - CELL_REGION=local
      - CELL_ZONE=local-a
      - REDIS_CLUSTER_LOCAL_CELL=local

  # 合并 base 的 dubbo-config, 覆盖指向不存在 nacos 的字段
  - name: dubbo-config
    namespace: education-platform
    behavior: merge
    literals:
      - DUBBO_REGISTRY_ADDRESS=nacos://127.0.0.1:8848?namespace=education-platform
      - DUBBO_METADATA_REPORT_ADDRESS=nacos://127.0.0.1:8848?namespace=education-platform
      - DUBBO_CONFIG_CENTER_ADDRESS=nacos://127.0.0.1:8848?namespace=education-platform
