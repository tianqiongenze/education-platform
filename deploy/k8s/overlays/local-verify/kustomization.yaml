apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# 本地验证 overlay: 适配 Rancher Desktop 单节点 k3s 集群
# 目的: 验证 K8s YAML 语法和基本调度能力, 非生产部署
#
# 覆盖策略:
#   1. 用 nginx:1.27-alpine 占位镜像替换不存在的内部仓库镜像
#   2. 移除 topologySpreadConstraints (单节点不适用)
#   3. 移除 envFrom (引用的 common-config/dubbo-config 中的服务 DNS 本地不存在)
#   4. 将 readiness/liveness/startupProbe 路径改为 / (nginx 默认返回 200)
#   5. 副本数统一设为 1 (单节点)
#   6. ServiceMonitor / PropagationPolicy / OverridePolicy CRD 未安装,
#      无法 apply - 用 patch 将这些资源整体替换为 ConfigMap (空) 占位,
#      避免在 apply 时因 CRD 缺失报错中断。
#      (kustomize 无法按 kind+name 删除整个资源, 只能改字段)
resources:
  - ../../base

patches:
  # ============ portal-bff ============
  - target:
      kind: Deployment
      name: portal-bff
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.27-alpine
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: remove
        path: /spec/template/spec/containers/0/envFrom
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/startupProbe/failureThreshold
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi

  # ============ core-business ============
  - target:
      kind: Deployment
      name: core-business
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.27-alpine
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: remove
        path: /spec/template/spec/containers/0/envFrom
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
