  # ============ otel-collector ============
  # otel-collector 引用的是真实镜像但内部仓库不可达, 也替换为 nginx 占位.
  # nginx 默认监听 :80, 但 base 的健康探针指向端口 13133 (otel health extension)
  # 该端口在容器中未监听 -> 探针会失败. 这里把探针端口改到 80.
  # 同时移除 otel 自定义 command/args (nginx 镜像自带 ENTRYPOINT).
  # 另: base 中端口名 "metrics-internal" (16字符) 超过 k8s 15 字符上限,
  # k3s 校验更严格会拒绝, 这里缩短为 "metrics-int" (Deployment + Service 都改).
  - target:
      kind: Deployment
      name: otel-collector
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: nginx:1.27-alpine
      - op: remove
        path: /spec/template/spec/containers/0/command
      - op: remove
        path: /spec/template/spec/containers/0/args
      - op: replace
        path: /spec/template/spec/containers/0/ports/3/name
        value: metrics-int
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/initialDelaySeconds
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/path
        value: /
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/httpGet/port
        value: 80
      - op: replace
        path: /spec/template/spec/containers/0/livenessProbe/initialDelaySeconds
        value: 5
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
  # otel-collector Service 的 targetPort 引用 "metrics-internal" 端口名,
  # 需同步缩短为 "metrics-int" 以匹配容器端口名.
  - target:
      kind: Service
      name: otel-collector
    patch: |-
      - op: replace
        path: /spec/ports/3/targetPort
        value: metrics-int

  # ============ HPA: minReplicas 全部设为 1 ============
  # base HPA 的 minReplicas 为 2-3, 会强制 Deployment 扩容到多副本,
  # 单节点 k3s CPU 不足 (8550m 已分配 95%) 导致 Pending. 本地验证设为 1.
  - target:
      kind: HorizontalPodAutoscaler
      name: portal-bff
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: core-business
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: grading-service
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: ai-platform
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
  - target:
      kind: HorizontalPodAutoscaler
      name: ws-gateway
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1

  # ============ D-140 Fix 4a: Ingress → traefik (k3s 自带 traefik, 无 nginx) ============
  # 移除 ingressClassName: nginx → traefik; 移除 TLS (本地无证书); 移除 nginx 注解.
  # host 保留 (api.edu.com / www.edu.com), 需在测试机 /etc/hosts 把它们指向 k3s IP.
  - target:
      kind: Ingress
      name: unified-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: remove
        path: /spec/tls
      - op: remove
        path: /metadata/annotations
  - target:
      kind: Ingress
      name: unified-ws-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: remove
        path: /spec/tls
      - op: remove
        path: /metadata/annotations
  - target:
      kind: Ingress
      name: portal-ingress
    patch: |-
      - op: replace
        path: /spec/ingressClassName
        value: traefik
      - op: remove
        path: /spec/tls
      - op: remove
        path: /metadata/annotations

