# D-225: file-based deletion of resources that must NOT deploy to
# applications-cluster (shared middleware is REUSED from infra/dify-plus
# namespaces; CRD-dependent resources dropped because the CRDs are absent).
#
# File-based `$patch: delete` under `patches:` is required because kubectl's
# embedded kustomize (v4.x) fails on list-style SMC delete patches for kinds
# outside its schema ("Unexpected kind: unknown").
# Names/namespaces verified against `kubectl kustomize deploy/k8s/base` output
# (base applies an `edu-` namePrefix; 3 ServiceMonitors lack a namespace).
