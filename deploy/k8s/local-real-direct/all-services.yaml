            - { name: REDIS_ADDR, value: "redis-cluster-new.ekb-m2-aws-us-east-1.svc.cluster.local:6379" }
          volumeMounts:
            - { name: jwt-keys, mountPath: /etc/jwt, readOnly: true }
          readinessProbe:
