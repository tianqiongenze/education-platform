# Ingress: Fix existing routes to use correct ports
# www.edu.com → frontend-portal:80 (already correct)
# api.edu.com → portal-bff:8090 (was :80, fixing)
# api.edu.com/ws → ws-gateway:8081 (already correct)
# ═══════════════════════════════════════════════════════════

# Fix portal-bff ingress (was pointing to port 80, should be 8090)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: edu-unified-ingress
  namespace: education-platform
  labels:
    app.kubernetes.io/name: portal-bff
    app.kubernetes.io/part-of: education-platform
spec:
  ingressClassName: traefik
  rules:
    - host: api.edu.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: edu-portal-bff
                port:
                  number: 8090
