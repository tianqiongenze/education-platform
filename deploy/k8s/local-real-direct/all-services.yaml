# D-215a: Direct K3s deployment for all 13 backend services (frontend-portal already running).
# Rancher Desktop K3s, lima-rancher-desktop node, 30GB RAM, 9 CPU.
# All services: ClusterIP (no NodePort) — access via Traefik Ingress at 192.168.5.15.
# Images: linux/arm64, pre-loaded in k3s containerd, imagePullPolicy: IfNotPresent.
#
# Memory plan (node has ~13GB available after infra):
#   Java services (11): request 384Mi, limit 768Mi → MaxRAMPercentage=60 → ~460MB heap
#   Go ws-gateway:      request 64Mi,  limit 128Mi
#   Python ai-platform:  request 256Mi, limit 512Mi
#
# Probe timing (Spring Boot + Dubbo startup = 60-120s):
#   readiness: initialDelay=30s, period=10s, failure=18 → 30+180=210s timeout
#   liveness:  initialDelay=120s, period=15s, failure=10 → 120+150=270s timeout
#
# Env vars override Spring Boot profile YAML (OS env = level 6 > profile yaml = level 8).
# Dubbo registry = N/A (no Nacos), Pulsar disabled, AOT disabled.
# All infra (TiDB, Redis, Pulsar, Milvus, Neo4j) via K3s ClusterIP FQDNs.

# ─── ConfigMap: logback-override (quiet logging for containers) ───
apiVersion: v1
kind: ConfigMap
metadata:
  name: logback-override
  namespace: education-platform
data:
  logback.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <appender name="STDOUT" class="ch.qos.logback.core.ConsoleAppender">
        <encoder><pattern>%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n</pattern></encoder>
      </appender>
      <root level="INFO"><appender-ref ref="STDOUT" /></root>
      <logger name="org.apache.dubbo" level="WARN"/>
      <logger name="org.springframework" level="WARN"/>
      <logger name="com.zaxxer.hikari" level="WARN"/>
      <logger name="org.hibernate" level="WARN"/>
    </configuration>

---
# ═══════════════════════════════════════════════════════════
# Tier 1: Core business services (TiDB-backed)
# ═══════════════════════════════════════════════════════════

# ─── core-business (8083) ───
apiVersion: v1
kind: Service
metadata:
  name: edu-core-business
  namespace: education-platform
spec:
  selector: { app: edu-core-business }
  ports:
    - { name: http, port: 8083, targetPort: 8083 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edu-core-business
  namespace: education-platform
spec:
  replicas: 1
  selector: { matchLabels: { app: edu-core-business } }
  template:
    metadata: { labels: { app: edu-core-business } }
    spec:
      containers:
        - name: app
          image: esp/edu-core-business:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8083 }]
          resources:
            requests: { memory: "384Mi", cpu: "200m" }
            limits:   { memory: "768Mi", cpu: "1500m" }
          envFrom:
            - configMapRef: { name: edu-common-config }
            - configMapRef: { name: edu-dubbo-config }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: "dev" }
            - { name: SPRING_AOT_ENABLED, value: "false" }
            - { name: EP_PULSAR_ENABLED, value: "false" }
            - { name: DUBBO_REGISTRY_ADDRESS, value: "N/A" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://tidb-cluster-tidb.ekb-m2-aws-us-east-1.svc.cluster.local:4000/ep_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" }
            - { name: SPRING_DATASOURCE_USERNAME, value: "root" }
            - { name: SPRING_DATASOURCE_PASSWORD, value: "" }
            - { name: SPRING_DATASOURCE_DRIVER_CLASS_NAME, value: "com.mysql.cj.jdbc.Driver" }
            - { name: SPRING_JPA_HIBERNATE_DDL_AUTO, value: "update" }
            - { name: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT, value: "org.hibernate.dialect.MySQLDialect" }
            - { name: SPRING_DATA_REDIS_HOST, value: "redis-cluster-new.ekb-m2-aws-us-east-1.svc.cluster.local" }
            - { name: SPRING_DATA_REDIS_PORT, value: "6379" }
            - { name: EP_CACHE_REDIS_HOST, value: "redis-cluster-new.ekb-m2-aws-us-east-1.svc.cluster.local" }
            - { name: EP_CACHE_REDIS_PORT, value: "6379" }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 120
            periodSeconds: 15
            failureThreshold: 10

---
