openapi: 3.0.3
info:
  title: Knowledge Service API
  description: |
    Education Platform — Knowledge Service (port 8071). Document upload,
    query, delete, and category management for the knowledge base.
    Contract-first spec (D-206).
  version: 1.0.0
  contact:
    name: EP Team
servers:
  - url: http://localhost:8071
    description: Local dev
security:
  - tenantAuth: []
tags:
  - name: kb
    description: Knowledge base management

paths:
  /api/v1/kb/documents:
    post:
      tags: [kb]
      summary: Upload a document
      operationId: uploadDocument
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RoleHeader'
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Uploaded document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/kb/documents/{id}:
    get:
      tags: [kb]
      summary: Get a document by id
      operationId: getDocument
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RoleHeader'
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '200':
          description: Document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [kb]
      summary: Delete a document
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RoleHeader'
        - $ref: '#/components/parameters/DocumentIdPath'
      responses:
        '204':
          description: Deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/kb/categories:
    get:
      tags: [kb]
      summary: List categories for a tenant
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
        - $ref: '#/components/parameters/RoleHeader'
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    tenantAuth:
      type: apiKey
      in: header
      name: X-Tenant-Id
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
    RoleHeader:
      name: X-Role
      in: header
      required: false
      schema:
        type: string
      description: Role for RBAC
    DocumentIdPath:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
    Document:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        title:
          type: string
        categoryId:
          type: string
        status:
          type: string
        size:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    Category:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        parentId:
          type: string
