decision_id: D-041
title: 多区域多活数据同步铁律
date: 2026-08-05
status: active
summary: >
  底层基础设施 (TiDB/Pulsar/Redis Cluster) 已升级为真正的多区域多活部署。
  TiDB: 通过 tidb_replica_read=follower JDBC 参数实现跨 cell follower read。
  Pulsar: Geo-Replication 国内 hz/sz/bj 全互联, 海外 sg 单向元数据同步。
  Redis Cluster: CRDT 跨 cell 异步合并, 支持多活缓存。
  K8s: Karmada PropagationPolicy 按 40/30/20/10 权重调度到 4 个 cell。
  Per-cell Kustomize overlays (cell-hz/cell-sz/cell-bj/cell-sg) 差异化配置。
  海外 cell-sg 启用数据隔离 (DATA_RESIDENCY=overseas, GDPR_COMPLIANCE=true)。
