decision_id: D-039
title: 虚拟线程铁律
date: 2026-08-05
status: active
summary: >
  所有 Spring Boot 4 Java 服务必须开启虚拟线程 (spring.threads.virtual.enabled=true)。
  synchronized 块会导致虚拟线程 pinning, 必须替换为 ReentrantLock。
  裸 new Thread() 必须替换为 Thread.startVirtualThread()。
impact_files:
  - services/sp03-business/src/main/java/com/ep/business/order/OrderServiceImpl.java
  - services/sp03-business/src/main/java/com/ep/business/user/UserServiceImpl.java
  - services/sp03-business/src/main/java/com/ep/business/course/CourseServiceImpl.java
  - services/ep-cache/src/main/java/com/ep/cache/CacheService.java
test_result: "sp03-business 38 tests pass, ep-cache 31 tests pass"
