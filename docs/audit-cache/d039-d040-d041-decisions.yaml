decision_id: D-040
title: GraalVM Native Image 铁律
date: 2026-08-05
status: active
summary: >
  所有 Spring Boot 4 Java 服务必须支持 GraalVM Native Image。
  pom.xml 添加 org.graalvm.buildtools:native-maven-plugin:0.10.4 (buildArgs 无execution绑定, 手动 mvn -Pnative native:compile)。
  application.yml 开启 spring.aot.enabled=true。
  双模式: JIT (开发) + Native (生产), 通过 Maven profile 切换。
