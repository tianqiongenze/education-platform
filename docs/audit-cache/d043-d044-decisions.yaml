decision_id: D-044
title: 全中台多租户SaaS可抽离改造规划
date: 2026-08-05
status: PROPOSED
summary: >
  所有中台(SP-01~SP-07)必须具备可抽离SaaS能力,能随时从教育行业剥离服务其他企业.
  三级隔离模型: Level1行级隔离(tenant_id+MyBatis拦截器,中小租户),
  Level2 Schema隔离(动态数据源路由,中大租户),
  Level3独立DB(物理隔离,旗舰租户).
  租户上下文用Java21 ScopedValue(D-039虚拟线程兼容).
  SaaS控制平面: 租户管理/配额管理/计量计费/API网关.
  各中台改造优先级: SP-07标杆(已原生支持)→SP-04 AI中台→SP-01基础设施→SP-02数据中台→SP-05 IT后台→SP-03业务中台(插件化,最高难度).
