decision_id: D-043
title: SP-07知识中台新建决策
date: 2026-08-05
status: PROPOSED
summary: >
  基于SP-04 AI中台构建企业级知识中台SP-07,服务5类用户群体(技术开发团队/其他员工/客服/授课教师/学员).
  6大功能域: 知识库管理(多格式解析/分块/向量化/版本/知识图谱),
  智能检索(混合检索RRF/RAG问答/推荐/联合检索),
  Agent管理(创建/编排/会话/工具扩展),
  知识共创(社区/评审/积分),
  多租户SaaS(三级隔离/配额/开放API),
  学习路径(AI推荐/进度/评估).
  原生多租户SaaS设计作为全中台SaaS化改造标杆.
  25条FR-KB需求, 12条NFR, 15个用户故事.
