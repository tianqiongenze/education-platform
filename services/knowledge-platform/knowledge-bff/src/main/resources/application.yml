server:
  port: 8070

spring:
  application:
    name: knowledge-bff
  # P1-4: Actuator endpoint security — HTTP Basic user for /actuator/** (non health/info).
  security:
    user:
      name: actuator
      password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
      roles: ACTUATOR
  threads:
    virtual:
      enabled: true   # D-039: virtual threads
  aot:
    enabled: true     # D-040: GraalVM AOT
  cloud:
    gateway:
      routes:
        - id: knowledge-service
          uri: lb://knowledge-service
          predicates:
            - Path=/api/v1/kb/**
          filters:
            - StripPrefix=0
        - id: retrieval-service
          uri: lb://retrieval-service
          predicates:
            - Path=/api/v1/retrieval/**
        - id: agent-service
          uri: lb://agent-service
          predicates:
            - Path=/api/v1/agents/**
        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/tenants/**

dubbo:
  application:
    name: knowledge-bff
  registry:
    address: nacos://nacos:8848
  scan:
    base-packages: com.ep.knowledge.bff

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# P2-10: Resilience4j RateLimiter (opt-in via @RateLimiter annotation)
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default
