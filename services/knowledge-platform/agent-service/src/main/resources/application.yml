server:
  port: 8073

spring:
  application:
    name: agent-service
  # P1-4: Actuator endpoint security — HTTP Basic user for /actuator/** (non health/info).
  security:
    user:
      name: actuator
      password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
      roles: ACTUATOR
  threads:
    virtual:
      enabled: true   # D-039: virtual threads
  aot:
    enabled: true     # D-040: GraalVM AOT
  # D-075: shared knowledge database (same cluster as knowledge-service, own pool)
  datasource:
    url: jdbc:postgresql://pg-primary:5432/knowledge
    username: ${PG_USER}
    password: ${PG_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20   # D-139 P0-3: 20 to match agent-service concurrent load
      pool-name: agent-service-pool
  data:
    redis:
      cluster:
        nodes: redis-1:6379,redis-2:6379,redis-3:6379
        max-redirects: 3

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: agent-service
  protocol:
    name: dubbo
    port: 20873
  registry:
    address: nacos://nacos:8848
  scan:
    base-packages: com.ep.knowledge.agent

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# D-045: multi-level intelligent memory
ep:
  memory:
    enabled: true
    use-rpc: true
    gateway-url: http://ai-platform-gateway:8000
    timeout-sec: 10

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

# P2-10: Resilience4j RateLimiter (opt-in via @RateLimiter annotation)
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default
