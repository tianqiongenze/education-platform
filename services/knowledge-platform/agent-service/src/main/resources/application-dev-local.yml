# D-108: Standalone local profile — zero external dependencies.
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev-local
# Boots entirely against H2 in-memory; no PG/Redis/Nacos/Pulsar/Seata needed.
spring:
  aot:
    enabled: false
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # D-108: no Redis locally — exclude Spring Data Redis auto-config.
      # (ep-memory-java uses Redis; disabling avoids connection failures at boot.)
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # D-108: redisson-spring-boot-starter targets SB3x classpaths; not needed locally.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # D-108: no Seata TC server locally — exclude Seata auto-config.
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataCoreAutoConfiguration
  datasource:
    # D-108: H2 in PostgreSQL compatibility mode (service targets PG in prod).
    url: jdbc:h2:mem:ep_agent;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

dubbo:
  registry:
    address: N/A

# D-045/D-108: multi-level intelligent memory — disable RPC + gateway deps locally.
ep:
  memory:
    enabled: false
    use-rpc: false
    gateway-url: http://127.0.0.1:8000
    timeout-sec: 10

seata:
  enabled: false

logging:
  level:
    root: INFO
    com.ep: DEBUG
