# D-108: Standalone local profile — zero external dependencies.
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev-local
# Boots entirely against H2 in-memory; no PG/Redis/Nacos/Minio/Pulsar/Seata needed.
spring:
  aot:
    enabled: false
  threads:
    virtual:
      enabled: true
  autoconfigure:
    exclude:
      # D-108: no Redis locally — exclude Spring Data Redis auto-config.
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      # D-108: no Seata TC server locally — exclude Seata auto-config.
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataCoreAutoConfiguration
      # D-108: redisson-spring-boot-starter targets SB3x classpaths; not needed locally.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
  datasource:
    # D-108: H2 in PostgreSQL compatibility mode (service targets PG in prod).
    url: jdbc:h2:mem:ep_knowledge;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

dubbo:
  registry:
    address: N/A

# D-108: Minio not available locally — point at a harmless localhost URL.
# File uploads will fail, but service boot does not require Minio connectivity.
minio:
  endpoint: http://127.0.0.1:9000
  access-key: local
  secret-key: local
  bucket: knowledge-docs

seata:
  enabled: false

logging:
  level:
    root: INFO
    com.ep: DEBUG
