# D-216: Production profile — CockroachDB dual-pool read/write split.
# Extends application.yml with the ep.data opt-in block.
# All secrets from environment variables. NEVER commit real credentials.
spring:
  aot:
    enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://crdb-primary:26257/ep_knowledge}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:redis-cluster}
      port: ${REDIS_PORT:6379}
      database: 0

dubbo:
  registry:
    address: nacos://${NACOS_ADDR}

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minio}
  secret-key: ${MINIO_SECRET_KEY:minio123}
  bucket: knowledge-docs

seata:
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP

logging:
  level:
    root: WARN
    com.ep: INFO

ep:
  # D-216: production read/write split. knowledge-service targets CockroachDB
  # (PostgreSQL-wire compatible) in the overseas deployment; read pool uses
  # follower reads for nearest-replica latency.
  # Set ep.data.enabled=true (or EP_DATA_ENABLED=true) to activate the dual pool;
  # when false, the spring.datasource.* block above remains authoritative.
  data:
    enabled: ${EP_DATA_ENABLED:false}
    provider: cockroachdb
    read-replicas: true
    follower-reads: true
    write:
      host: ${CRDB_PRIMARY:crdb-primary:26257}
      database: ep_knowledge
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 10
    read:
      host: ${CRDB_FOLLOWER:crdb-follower:26257}
      database: ep_knowledge
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 20
