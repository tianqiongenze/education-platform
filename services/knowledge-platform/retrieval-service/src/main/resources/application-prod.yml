# D-069: Production profile — all secrets from env vars. NEVER commit real credentials.
spring:
  aot:
    enabled: true
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
        max-redirects: 3

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://${NACOS_ADDR}}

milvus:
  host: ${MILVUS_HOST}
  port: ${MILVUS_PORT:19530}
  collection: knowledge_vectors
  dimension: 1536

elasticsearch:
  host: ${ES_HOST}
  port: ${ES_PORT:9200}
  scheme: ${ES_SCHEME:http}
  index: knowledge_docs

logging:
  level:
    root: WARN
    com.ep: INFO
