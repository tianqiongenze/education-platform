# D-069: Production profile — all secrets from env vars. NEVER commit real credentials.
spring:
  aot:
    enabled: true
  datasource:
    url: ${TIDB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:redis-cluster}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 2000ms

dubbo:
  registry:
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://${NACOS_ADDR}}
  consumer:
    # D-232: registry=N/A mode — reference startup checks must be off,
    # otherwise "No such any registry to reference" fails the boot.
    check: false

csp:
  sentinel:
    transport:
      dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      port: 8719

seata:
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP

# D-048 P1-3: Redisson distributed lock
redisson:
  config: |
    singleServerConfig:
      address: "redis://${REDIS_HOST:redis-cluster}:${REDIS_PORT:6379}"
      database: 0

logging:
  level:
    root: WARN
    com.ep.grading: INFO
    org.apache.dubbo: WARN

# ai-platform integration: enable AI grading in prod; keep graceful pending fallback.
ep:
  ai-grading:
    enabled: true
    fallback: pending
  # D-216: production read/write split. grading-service targets CockroachDB in the
  # overseas deployment; read pool uses follower reads for nearest-replica latency.
  # Set ep.data.enabled=true (or EP_DATA_ENABLED=true) to activate the dual pool;
  # when false, the spring.datasource.* block above remains authoritative.
  data:
    enabled: ${EP_DATA_ENABLED:false}
    provider: cockroachdb
    read-replicas: true
    follower-reads: true
    write:
      host: ${CRDB_PRIMARY:crdb-primary:26257}
      database: ep_grading
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 10
    read:
      host: ${CRDB_FOLLOWER:crdb-follower:26257}
      database: ep_grading
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 20
