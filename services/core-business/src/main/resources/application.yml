server:
  port: 8083

spring:
  application:
    name: core-business
  # P1-4: Actuator endpoint security — HTTP Basic user for /actuator/** (non health/info).
  security:
    user:
      name: actuator
      password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
      roles: ACTUATOR
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}  # D-069: default to dev
  config:
    import: "optional:file:./config/application-${spring.profiles.active}.yml"  # D-069: external override
  threads:
    virtual:
      enabled: true  # D-039: 虚拟线程铁律
  aot:
    enabled: false  # D-069: common base — overridden to true in prod
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect  # D-076: Hibernate 7.2 dropped TiDBDialect; TiDB is MySQL-compatible

dubbo:
  application:
    name: core-business
  protocol:
    name: dubbo
    port: 20883
    threads: 500        # P0: 默认200不够1000并发, 扩到500
    threadpool: cached  # P0: cached弹性线程池, 适配突发流量(配合D-039虚拟线程)
  consumer:
    timeout: 10000      # P4: 5000→10000, 1000并发下DB池竞争需更长等待
    retries: 0          # P2: 写操作不重试, 避免幂等被打破
    check: false
  provider:
    timeout: 10000      # P4: 5000→10000, 匹配consumer超时

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    circuitbreakers:
      enabled: true

# P1: Resilience4j circuit breakers for downstream service calls
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 20
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
    instances:
      inventoryService:
        base-config: default
      paymentService:
        base-config: default
  timelimiter:
    configs:
      default:
        timeout-duration: 5s
    instances:
      inventoryService:
        base-config: default
      paymentService:
        base-config: default
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default

# D-048/P0-7: Sentinel dashboard
csp:
  sentinel:
    app:
      name: core-business

# D-048/P1-3: Seata configuration (common keys; env-specific in profile files)
seata:
  enabled: true
  application-id: core-business
  tx-service-group: ep_tx_group
  service:
    vgroup-mapping:
      ep_tx_group: default

# D-070: springdoc-openapi
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# D-066: Pulsar domain-event publishing (disabled by default; enabled in prod profile).
ep:
  pulsar:
    enabled: false
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
    topic:
      domain-events: persistent://public/default/core-business-domain-events
