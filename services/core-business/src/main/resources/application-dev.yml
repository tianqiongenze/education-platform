# D-069: Dev profile — uses local port-forward to K8s cluster. NOT for production.
spring:
  aot:
    enabled: false
  autoconfigure:
    exclude:
      # D-076: redisson-spring-boot-starter 3.51.0 targets Spring Boot 3.x and references
      # the removed org.springframework.boot.autoconfigure.data.redis.RedisProperties class
      # (SB4 moved it to org.springframework.boot.data.redis.autoconfigure.DataRedisProperties).
      # ep-cache provides its own RedisTemplate/ConnectionFactory; redisson auto-config is not needed in dev.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # D-078: Seata TC server unavailable in dev (no Seata pods in K8s). OrderServiceImpl uses
      # @GlobalTransactional which fails without TC. Exclude Seata auto-config to prevent failures.
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataCoreAutoConfiguration
  datasource:
    url: jdbc:mysql://127.0.0.1:4000/ep_business?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # D-132: aligned with prod (50) — dev was 200 causing false load-test confidence
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 10000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

dubbo:
  registry:
    address: nacos://127.0.0.1:8848

csp:
  sentinel:
    transport:
      dashboard: 127.0.0.1:8858

seata:
  enabled: false
  tx-service-group: ep_tx_group
  service:
    vgroup-mapping:
      ep_tx_group: default
  registry:
    type: file

logging:
  level:
    root: INFO
    com.ep: DEBUG

# D-066: Pulsar disabled in dev — PulsarEventPublisher is a no-op (EP_DEV_ONLY-safe).
ep:
  pulsar:
    enabled: false
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
