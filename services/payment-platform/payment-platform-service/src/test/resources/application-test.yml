server:
  port: 0
spring:
  application:
    name: payment-platform-test
  # D-132: H2 in-memory for the test profile. The Testcontainers IT overrides
  # this via @DynamicPropertySource with a real MySQL container.
  datasource:
    url: jdbc:h2:mem:paymentdb_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
dubbo:
  application:
    name: payment-platform-test
  protocol:
    name: dubbo
    port: -1
  registry:
    address: N/A
ep:
  payment:
    dev-guard: true
management:
  endpoints:
    web:
      exposure:
        include: health
