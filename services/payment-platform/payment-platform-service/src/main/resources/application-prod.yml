# D-216: Production profile — CockroachDB dual-pool read/write split.
# Extends application.yml with the ep.data opt-in block.
# All secrets from environment variables. NEVER commit real credentials.
server:
  port: 8087

spring:
  aot:
    enabled: true
  threads:
    virtual:
      enabled: true
  application:
    name: payment-platform
  security:
    user:
      name: actuator
      password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
      roles: ACTUATOR
  datasource:
    url: ${TIDB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      connection-test-query: SELECT 1
  data:
    redis:
      host: ${REDIS_HOST:redis-cluster}
      port: ${REDIS_PORT:6379}
      database: 0

dubbo:
  application:
    name: payment-platform
  protocol:
    name: dubbo
    port: 20887
  registry:
    address: nacos://${NACOS_ADDR}

csp:
  sentinel:
    transport:
      dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}

seata:
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP
  config:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDR}
      namespace: ""
      group: SEATA_GROUP

logging:
  level:
    root: WARN
    com.ep: INFO

ep:
  cache:
    enabled: true
  payment:
    dev-guard: false
  pulsar:
    enabled: true
    service-url: ${PULSAR_SERVICE_URL:pulsar://localhost:6650}
  # D-216: production read/write split. payment-platform-service targets
  # CockroachDB in the overseas deployment; read pool uses follower reads
  # for nearest-replica latency. Financial records must always write to the
  # primary pool; read-only queries (statement history, balance lookups) can
  # safely use follower reads.
  # Set ep.data.enabled=true (or EP_DATA_ENABLED=true) to activate the dual
  # pool; when false, the spring.datasource.* block above remains authoritative.
  data:
    enabled: ${EP_DATA_ENABLED:false}
    provider: cockroachdb
    read-replicas: true
    follower-reads: true
    write:
      host: ${CRDB_PRIMARY:crdb-primary:26257}
      database: ep_payment
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 10
    read:
      host: ${CRDB_FOLLOWER:crdb-follower:26257}
      database: ep_payment
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:}
      maximum-pool-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# D-154 P2-10: Resilience4j rate limiter.
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default
