[tool.poetry]
name = "ep-common"
version = "0.1.0"
description = "Education-platform shared Python utilities (config, health, response, logging, cache). D-110."
authors = ["EP Team"]
readme = "README.md"
packages = [{include = "ep_common"}]

[tool.poetry.dependencies]
python = "^3.12"
# Cache module (ep_common.cache) uses redis lazily — services that need L2
# cache bring their own redis dependency (e.g. ai-platform already ships it).
redis = {version = ">=5.0", optional = true}

[tool.poetry.extras]
cache = ["redis"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
# fakeredis powers the cache Pub/Sub tests without a real Redis cluster.
fakeredis = "^2.20"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
