# D-108: Standalone local profile — zero external dependencies.
# Usage: mvn spring-boot:run -Dspring-boot.run.profiles=dev-local
# Boots entirely against H2 in-memory; no TiDB/Redis/Nacos/Pulsar/Seata needed.
spring:
  aot:
    enabled: false
  autoconfigure:
    exclude:
      # D-076/D-108: redisson-spring-boot-starter targets SB3x classpaths; not needed locally.
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      # D-078/D-108: no Seata TC server locally — exclude Seata auto-config.
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataCoreAutoConfiguration
      # D-108: no Redis locally — exclude Spring Data Redis auto-config.
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:ep_elder;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

dubbo:
  registry:
    address: N/A

csp:
  sentinel:
    enabled: false

seata:
  enabled: false
  tx-service-group: ep_tx_group
  service:
    vgroup-mapping:
      ep_tx_group: default
  registry:
    type: file

ep:
  pulsar:
    enabled: false
  # D-216: read/write-split datasource routing. dev-local defaults to OFF so the
  # plain H2 datasource above stays in effect; flip to true to exercise the
  # EpRoutingDataSource dual-pool path locally.
  data:
    enabled: false
    provider: h2
    read-replicas: false
    write:
      url: jdbc:h2:mem:ep_elder;DB_CLOSE_DELAY=-1;MODE=MySQL
      username: sa
      password: ""
    read:
      url: jdbc:h2:mem:ep_elder;DB_CLOSE_DELAY=-1;MODE=MySQL

logging:
  level:
    root: INFO
    com.ep: DEBUG
