spring:
  datasource:
    url: jdbc:h2:mem:ep_boardgame;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  sql:
    init:
      mode: always

# Exclude Redisson/Seata auto-config in dev-local (no Redis/Seata running)
autoconfiguration:
  exclude:
    - org.redisson.spring.starter.RedissonAutoConfigurationV2
    - io.seata.spring.boot.autoconfigure.SeataAutoConfiguration

dubbo:
  registry:
    address: N/A
  protocol:
    port: -1

ep:
  pulsar:
    enabled: false
