# ep-web-common 通用配置示例
#
# P1-6: 虚拟线程 DB 连接限流（Semaphore）
# 背景：项目已启用 spring.threads.virtual.enabled=true，虚拟线程数量可远超
# 平台线程，但 HikariCP 连接池容量有限。本配置在获取 DB 连接前用 Semaphore
# 限流，避免大量虚拟线程同时争抢连接导致连接池打穿 / pinning / 雪崩。
#
# 各服务按需在自身 application.yml 中覆盖下列值：
ep:
  db:
    concurrent-acquire-limit:
      enabled: false      # 默认关闭，需要的服务自行开启
      permits: 20         # 许可数，建议与 HikariCP maximum-pool-size 一致
      timeout-ms: 5000    # 获取许可超时 5 秒，超时触发限流降级

# D-216: ep-data shared read/write-split datasource (services/ep-data).
# Disabled by default — enable per environment; provider freely selectable.
# ep:
