server:
  port: 8082

spring:
  # D-216 (P1-1): virtual threads — data-platform was one of 3 services missing them
  threads:
    virtual:
      enabled: true
  application:
    name: data-platform
  main:
    web-application-type: servlet

# EP_DEV_ONLY guard — dev/CI default true (Iron Law 0)
EP_DEV_ONLY: true

# AI Gateway configuration (NL Query)
EP_AI_GATEWAY_URL: http://localhost:8000
EP_AI_LLM_MODEL: gpt-4o
EP_AI_LLM_TEMPERATURE: "0.0"
EP_AI_LLM_TIMEOUT_SEC: "10"
EP_AI_LLM_MAX_TOKENS: "4096"

# OpenAPI / springdoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ep.data: INFO

# P1-4: Actuator endpoint security — HTTP Basic user for /actuator/** (non health/info).
spring.security:
  user:
    name: actuator
    password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
    roles: ACTUATOR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# P2-10: Resilience4j RateLimiter (opt-in via @RateLimiter annotation)
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default

# D-171: Disruptor ingest pipeline (SDD §5.5 Worker Separation Pattern)
ep:
  role: ${EP_ROLE:api}
  disruptor:
    buffer-size: 65536
    wait-strategy: SLEEPING
    batch-size: 64
    batch-timeout-ms: 100
  pulsar:
    enabled: ${EP_PULSAR_ENABLED:false}
    service-url: pulsar://pulsar-broker:6650
