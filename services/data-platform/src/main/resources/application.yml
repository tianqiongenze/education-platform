server:
  port: 8082

spring:
  application:
    name: data-platform
  main:
    web-application-type: servlet

# EP_DEV_ONLY guard — dev/CI default true (Iron Law 0)
EP_DEV_ONLY: true

# SP-04 AI Gateway configuration (NL Query)
SP04_GATEWAY_URL: http://localhost:8000
SP04_LLM_MODEL: gpt-4o
SP04_LLM_TEMPERATURE: "0.0"
SP04_LLM_TIMEOUT_SEC: "10"
SP04_LLM_MAX_TOKENS: "4096"

# OpenAPI / springdoc
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ep.data: INFO

# P1-4: Actuator endpoint security — HTTP Basic user for /actuator/** (non health/info).
spring.security:
  user:
    name: actuator
    password: ${EP_ACTUATOR_PASSWORD:actuator-secret}
    roles: ACTUATOR

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

# P2-10: Resilience4j RateLimiter (opt-in via @RateLimiter annotation)
resilience4j:
  ratelimiter:
    configs:
      default:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 500ms
    instances:
      default:
        base-config: default
