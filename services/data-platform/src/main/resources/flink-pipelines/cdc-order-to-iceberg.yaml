# =============================================================================
# SP-02 Data Middle-Platform — Flink CDC 3.x YAML pipeline
# Order CDC: Pulsar (Avro) -> Iceberg ods.ods_order
# D-028: TiCDC -> Pulsar (Avro + built-in Schema Registry, ns=cdc://) -> Flink -> Iceberg
# C-02: NO Flink-CDC direct-to-TiDB (GC safepoint block)
# C-03: Flink->Iceberg MUST use checkpoint=commit
# C-07: Avro + Schema Registry mandatory, NO JSON CDC
# =============================================================================
source:
  type: pulsar
  name: order-cdc-source
  topic: persistent://public/cdc/order_group
  subscription: flink-cdc-order-ods
  subscriptionType: Shared
  # C-07: Avro wire format with Pulsar built-in Schema Registry
  value:
    format: avro
    avro-schema-file: avro/order-cdc.avsc
  startCursor: Earliest
  properties:
    schema.registry.url: "http://pulsar-broker:8080"
    schema.registry.namespace: "cdc://"

route:
  - source-table: order_0000
    sink-table: ods.ods_order
  - source-table: order_0001
    sink-table: ods.ods_order
  - source-table: order_0002
    sink-table: ods.ods_order
  - source-table: order_0003
    sink-table: ods.ods_order
  # ... order_0004..order_1023 route to ods.ods_order (1024 logical shards)
  - source-table: order_0004
    sink-table: ods.ods_order
  - source-table: order_0005
    sink-table: ods.ods_order
  - source-table: order_0006
    sink-table: ods.ods_order
  - source-table: order_0007
    sink-table: ods.ods_order
  # (shards order_0008..order_1023 omitted for brevity; generated at deploy time)
  - source-table: order_1023
    sink-table: ods.ods_order

sink:
  type: iceberg
  name: iceberg-order-ods
  catalog:
    name: iceberg_jdbc
    type: jdbc
    uri: jdbc:postgresql://catalog-pg:5432/iceberg
    warehouse: s3://edu-iceberg/warehouse
    driver: org.postgresql.Driver
  database: ods
  table: ods_order
  # C-03: checkpoint commit mode (Flink checkpoint == Iceberg commit)
  commit:
    mode: checkpoint
  # Target file size 256MB, zstd compression
  target-file-size: 256MB
  compression: zstd
  properties:
    format-version: "2"
    write.format.default: parquet
    write.parquet.compression-codec: zstd

# Maintenance: compact + expire snapshots + remove orphan files
maintenance:
  rewrite_data_files:
    enabled: true
    target-file-size: 256MB
    max-file-group-size-bytes: 512MB
  expire_snapshots:
    enabled: true
    retain_last: 5
  remove_orphan_files:
    enabled: true

# Flink execution configuration
flink:
  parallelism: 32
  checkpoint:
    interval: 5min
    mode: EXACTLY_ONCE
    state-backend: rocksdb
    min-pause: 1min
    timeout: 10min
    max-concurrent: 1
    externalized-checkpoint: RETAIN_ON_CANCELLATION
  restart-strategy:
    type: exponential-delay
    initial-backoff: 10s
    max-backoff: 5min
    backoff-multiplier: 2.0
