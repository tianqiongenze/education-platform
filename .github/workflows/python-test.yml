name: Python Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/ai-platform/**/*.py'
      - 'services/ai-platform/pyproject.toml'
      - 'services/ep-common-python/**/*.py'
      - 'services/ep-common-python/pyproject.toml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ai-platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-platform
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.create true
      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.virtualenvs
          key: ${{ runner.os }}-poetry-ai-${{ hashFiles('services/ai-platform/poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-ai-
      - name: Install dependencies
        run: poetry install
      - name: Run tests (exclude live)
        run: poetry run pytest -m "not live" --tb=short
      - name: Run tests with coverage
        run: |
          poetry run pytest -m "not live" \
            --cov=ai_gateway \
            --cov=ai_rag \
            --cov=ai_agent \
            --cov=ai_mcp \
            --cov=ai_a2a \
            --cov=ai_harness \
            --cov=ai_hermes \
            --cov=ai_plugin \
            --cov=ep_memory \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Coverage gate (>= 70%)
        run: |
          poetry run pytest -m "not live" \
            --cov=ai_gateway --cov=ai_rag --cov=ai_agent --cov=ai_mcp \
            --cov=ai_a2a --cov=ai_harness --cov=ai_hermes --cov=ai_plugin \
            --cov=ep_memory \
            --cov-fail-under=70
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-ai-platform
          path: services/ai-platform/coverage.xml
          if-no-files-found: ignore

  ep-common-python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ep-common-python
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: |
          pipx install poetry
          poetry config virtualenvs.create true
      - name: Install dependencies
        run: poetry install
      - name: Run tests with coverage
        run: |
          poetry run pytest \
            --cov=ep_common \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing
      - name: Coverage gate (>= 60%)
        run: |
          poetry run pytest --cov=ep_common --cov-fail-under=60
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-ep-common-python
          path: services/ep-common-python/coverage.xml
          if-no-files-found: ignore

  coverage-gate:
    runs-on: ubuntu-latest
    needs: [ai-platform, ep-common-python]
    if: always()
    steps:
      - name: Python coverage summary
        run: |
          echo "## Python Coverage Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Threshold | Job Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| ai-platform | >= 70% | ${{ needs.ai-platform.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ep-common-python | >= 60% | ${{ needs.ep-common-python.result }} |" >> $GITHUB_STEP_SUMMARY
