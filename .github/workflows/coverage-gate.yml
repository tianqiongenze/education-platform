name: Coverage Gate (Nightly)

on:
  schedule:
    - cron: '0 1 * * *'  # Nightly at 1 AM UTC
  workflow_dispatch:

jobs:
  aggregate-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Poetry
        run: pipx install poetry
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Java coverage (core-business)
        working-directory: services/core-business
        run: |
          mvn test -B -DexcludedGroups=live
          mvn jacoco:report -B
      - name: Java coverage (grading-service)
        working-directory: services/grading-service
        run: |
          mvn test -B -DexcludedGroups=live
          mvn jacoco:report -B

      - name: Python coverage (ai-platform)
        working-directory: services/ai-platform
        run: |
          poetry install
          poetry run pytest -m "not live" \
            --cov=ai_gateway --cov=ai_rag --cov=ai_agent --cov=ai_mcp \
            --cov=ai_a2a --cov=ai_harness --cov=ai_hermes --cov=ai_plugin \
            --cov=ep_memory \
            --cov-report=xml:coverage.xml

      - name: Frontend coverage
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Coverage Summary
        if: always()
        run: |
          echo "## Nightly Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Module | Coverage Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| core-business | JaCoCo | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| grading-service | JaCoCo (≥80%) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| ai-platform | pytest-cov (≥70%) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| frontend | vitest v8 (≥70%) | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Overall target: ≥75% aggregate coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ If coverage drops below threshold, create an issue to track." >> $GITHUB_STEP_SUMMARY

      - name: Upload all coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: |
            services/core-business/target/site/jacoco/
            services/grading-service/target/site/jacoco/
            services/ai-platform/coverage.xml
            frontend/**/coverage/
          if-no-files-found: ignore
