name: Frontend Tests

on:
  pull_request:
    branches: [main, sp01-tech-platform-m0]
    paths:
      - 'frontend/**'
  push:
    branches: [main, sp01-tech-platform-m0]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Get pnpm store
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
        continue-on-error: true  # Lint is advisory for now
      - name: Unit tests (vitest with coverage)
        run: pnpm test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/**/coverage/
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend/apps/admin-web
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests (chromium only)
        working-directory: frontend/apps/admin-web
        run: npx playwright test --project=chromium
        continue-on-error: true  # E2E requires running backends; advisory in CI
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/admin-web/playwright-report/
          if-no-files-found: ignore
