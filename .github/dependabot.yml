# Dependabot configuration — D-063: Automated dependency updates
# Keeps Java (Maven), Python (Poetry/pip), JavaScript (npm), and GitHub Actions
# dependencies up to date with weekly checks.

version: 2

updates:
  # Java — core-business
  - package-ecosystem: "maven"
    directory: "/services/core-business"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — grading-service
  - package-ecosystem: "maven"
    directory: "/services/grading-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — portal-bff
  - package-ecosystem: "maven"
    directory: "/services/portal-bff"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — knowledge-platform (retrieval-service)
  - package-ecosystem: "maven"
    directory: "/services/knowledge-platform/retrieval-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — order-platform
  - package-ecosystem: "maven"
    directory: "/services/order-platform/order-platform-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — payment-platform
  - package-ecosystem: "maven"
    directory: "/services/payment-platform/payment-platform-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — senior-care
  - package-ecosystem: "maven"
    directory: "/services/senior-care"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — boardgame-service
  - package-ecosystem: "maven"
    directory: "/services/boardgame-service"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "java"]

  # Java — integration-tests
  - package-ecosystem: "maven"
    directory: "/services/integration-tests"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "java", "test"]

  # Python — ai-platform
  - package-ecosystem: "pip"
    directory: "/services/ai-platform"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]

  # JavaScript — frontend (pnpm workspace root)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "wednesday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "javascript"]

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
